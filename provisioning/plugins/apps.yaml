apiVersion: 1

apps:
  - type: 'maqsam-lighthouse-api-client-app'
    org_id: 1
    org_name: 'maqsam'
    disabled: false
    jsonData:
      # One row per Lighthouse scope. These are development defaults only —
      # the real list is entered on the plugin's configuration page.
      endpoints:
        - environment: staging
          cell: mq
          url: http://lighthouse-stub:4567
      team: root
    secureJsonData:
      lighthouseUsername: lighthouse
      lighthousePassword: development-only
